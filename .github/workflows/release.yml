name: Release addon
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - run: python scripts/test.py
      - run: python scripts/package.py --tag "$TAG_NAME"
      - name: Publish installable addon
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG_NAME" "outputs/QuestStrangTracker-$TAG_NAME.zip" \
            --verify-tag --generate-notes --title "QuestStrangTracker $TAG_NAME"
